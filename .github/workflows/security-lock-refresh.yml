name: Refresh security dependency lockfile

on:
  push:
    branches:
      - security/refresh-dependencies-develop-20261009
    paths:
      - package.json
      - .github/workflows/security-lock-refresh.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.repository == 'GeniusVentures/gnus-ai' && github.ref == 'refs/heads/security/refresh-dependencies-develop-20261009'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v5
        with:
          ref: security/refresh-dependencies-develop-20261009
          persist-credentials: true
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Use repository Yarn
        run: corepack enable
      - name: Regenerate lockfile and check reproducibility
        run: |
          set -euo pipefail
          yarn install --mode=update-lockfile
          yarn install --immutable
          yarn npm audit --severity moderate
      - name: Commit only generated lockfile
        run: |
          set -euo pipefail
          git diff --check
          git add yarn.lock
          if git diff --cached --quiet; then
            echo "Lockfile already matches package.json"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(security): refresh Yarn lockfile for patched transitive dependencies'
          git push origin HEAD:security/refresh-dependencies-develop-20261009
